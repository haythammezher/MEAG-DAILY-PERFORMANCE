<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEAG Daily Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeee;--panel:#f9fbfa;--ink:#13221f;--mute:#586d68;--line:#cbd8d5;--ok:#17724a;--warn:#b9780f;--bad:#c2332b;--acc:#17724a;--arr:#8aa3ad;--soft:#dde8e5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1816;--panel:#16251f;--ink:#e5efec;--mute:#8fa8a1;--line:#27403a;--ok:#4fcf96;--warn:#f0b24a;--bad:#ff7b6e;--acc:#4fcf96;--arr:#5b7a85;--soft:#1f342d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1816;--panel:#16251f;--ink:#e5efec;--mute:#8fa8a1;--line:#27403a;--ok:#4fcf96;--warn:#f0b24a;--bad:#ff7b6e;--acc:#4fcf96;--arr:#5b7a85;--soft:#1f342d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 18px 44px}
h1,h2,.n{font-family:"Barlow Semi Condensed",Barlow,system-ui,sans-serif;margin:0}
h1{font-size:clamp(24px,4vw,36px);font-weight:700}
.head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.sub{color:var(--mute);font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,.btn{font:inherit;font-size:14px;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);border-left:5px solid var(--c)}
.kpi span{display:block;font-size:13px;color:var(--mute)}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1;margin:2px 0}
.kpi small{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;font-weight:600;margin-bottom:2px}
.card .sub{margin-bottom:10px}
svg{width:100%;height:auto;display:block}
g[data-a]{cursor:pointer}
g[data-a]:hover{opacity:.75}
.cz{display:grid;gap:6px}
.cz button{display:grid;grid-template-columns:200px 1fr 56px;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:3px 4px;border-radius:6px}
.cz button.on{background:var(--soft)}
.tr{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--warn)}
.tr i.gh{background:var(--bad)}
.tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tab th{text-align:left;font-weight:600;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.tab td{padding:6px 8px;border-bottom:1px solid var(--line)}
.tab tr[data-a]{cursor:pointer}
.tab tr[data-a]:hover td,.tab tr.sel td{background:var(--soft)}
.tab tr.late td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.tab .dt td{background:var(--soft);color:var(--mute)}
.sc{overflow:auto;max-height:460px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--soft)}
.msg{font-size:14px}select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:980px){.g2{grid-template-columns:1fr}}
details{font-size:14px;color:var(--mute)}
details b{color:var(--ink)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.cz button{grid-template-columns:130px 1fr 46px}}
:root{--bg:#e6eef7;--panel:#fff;--ink:#0a1d36;--mute:#546a84;--line:#cddae8;--acc:#0e5aa7;--arr:#8db2da;--soft:#e2ecf7;--ok:#0f8a5f;--warn:#c27a00;--bad:#d0382d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050e1c;--panel:#0c1b32;--ink:#e8f0fa;--mute:#8aa3bf;--line:#1b3253;--acc:#52a8ff;--arr:#3b5f88;--soft:#12284a;--ok:#3ddc97;--warn:#ffb400;--bad:#ff7b6e}}
:root[data-theme="dark"]{--bg:#050e1c;--panel:#0c1b32;--ink:#e8f0fa;--mute:#8aa3bf;--line:#1b3253;--acc:#52a8ff;--arr:#3b5f88;--soft:#12284a;--ok:#3ddc97;--warn:#ffb400;--bad:#ff7b6e}
h1,h2,.n{font-family:B612,'Barlow Semi Condensed',system-ui,sans-serif}
.card{border-radius:14px;box-shadow:0 8px 22px -14px rgba(5,25,55,.5)}
.card h2{font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.kpi{border-left:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px}
.kpi .n{font-family:'B612 Mono',monospace;font-size:25px}
.kpi span{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 28px 46px;margin-bottom:16px;border-radius:18px;color:#fff;background:radial-gradient(900px 260px at 88% -30%,#2a78d0 0,transparent 62%),linear-gradient(135deg,#050f22,#0b2a55)}
.hero h1{font-size:clamp(24px,4.4vw,42px);letter-spacing:.03em;text-transform:uppercase;margin:6px 0 4px}
.hero p{margin:0 0 14px;color:#a9c4e8;font-size:14px}
.eyebrow{font:700 11px B612,sans-serif;letter-spacing:.14em;color:#ffb400}
.pill{display:inline-flex;align-items:center;gap:8px;font:700 11px B612,sans-serif;letter-spacing:.1em;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);margin-bottom:10px}
.pill i{width:9px;height:9px;border-radius:50%;background:#ffb400}
.pill.live i{background:#3ddc97;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.7)}50%{box-shadow:0 0 0 7px rgba(61,220,151,0)}}
.hero .btn.go{background:#ffb400;color:#06152b;border:0;font-weight:600}
.gauge{width:150px}.gv{font:700 28px 'B612 Mono',monospace;fill:#fff}.gl{font:700 8px B612,sans-serif;fill:#9db7d6;letter-spacing:.08em}
.rwy{position:absolute;left:0;right:0;bottom:0;height:16px;background:#14233b}
.rwy:before{content:'';position:absolute;left:0;right:0;top:7px;height:2px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 44px);opacity:.75}
.jet{position:absolute;bottom:6px;left:-40px;width:34px;height:34px;fill:#fff;transform:rotate(90deg);animation:fly 16s linear infinite}
@keyframes fly{to{left:calc(100% + 40px)}}
@media (prefers-reduced-motion:reduce){.jet{animation:none;left:62%}.pill.live i{animation:none}}
.fids{background:#06142a;border:1px solid #17335d;color:#d7e6fb}
.fids h2{color:#ffb400}.fids .sub{color:#8fb0d8}
.fids .tab{font-family:'B612 Mono',monospace;font-size:13px}
.fids .tab th{background:#06142a;color:#6f93c4;border-bottom:1px solid #17335d;font:700 11px B612,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.fids .tab td{color:#ffc933;border-bottom:1px solid #112a4e}
.fids .tab td:nth-child(3){color:#fff}
.fids .chip{background:#12315c;color:#fff}
.fids .tab tr[data-a]:hover td,.fids .tab tr.sel td{background:#0d2548}
.fids .tab tr.late td{color:#ff8a7e}
.fids .tab .dt td{background:#0d2548;color:#a9c4e8}
@media print{body{background:#fff}.hero,.seg,.noprint,details{display:none!important}.wrap{padding:0}.paper{box-shadow:none;border:0}}
</style>
